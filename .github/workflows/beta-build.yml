name: Build and publish VietTube parked-video beta APK

on:
  push:
    branches:
      - feature/viettube-parked-video
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate parked-video manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}'
          app = ET.parse('app/src/main/AndroidManifest.xml').getroot().find('application')
          assert app is not None and app.get(ns + 'appCategory') == 'video'
          assert not app.findall('service')
          categories = [c.get(ns + 'name') for a in app.findall('activity') for f in a.findall('intent-filter') for c in f.findall('category')]
          assert 'android.intent.category.CAR_LAUNCHER' in categories
          print('Video Activity declaration valid; Android Auto visibility not guaranteed')
          PY
      - name: Build Android 17-compatible beta APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk viettube-beta.apk
      - name: Save beta build artifact
        uses: actions/upload-artifact@v4
        with:
          name: viettube-parked-video-beta
          path: viettube-beta.apk
      - name: Publish public beta APK without changing latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view viettube-parked-beta > /dev/null 2>&1; then
            gh release upload viettube-parked-beta viettube-beta.apk --clobber
          else
            gh release create viettube-parked-beta viettube-beta.apk \
              --title 'VietTube — parked-video beta' \
              --notes 'Beta APK for phone testing. Does not guarantee YouTube appears on Android Auto. Video only while parked. Installs as vn.viettube.app.beta.' \
              --target "$GITHUB_SHA" --prerelease
          fi
